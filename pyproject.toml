[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipment-analysis"
version = "2.0.0"
description = "Sentiment, aspect and topic analysis of UK courier reviews"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Muhammad Sheryar Adil" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "vaderSentiment>=3.3.2",
  "textblob>=0.17",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.45", "plotly>=5.18"]
extra = ["transformers>=4.40", "torch>=2.1", "bertopic>=0.16"]
dev = ["pytest>=7.4"]

[project.scripts]
shipment-analysis = "shipment_analysis.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
