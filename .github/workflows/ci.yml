name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run pipeline on demo data
        run: python -m shipment_analysis.pipeline --input data/sample/demo_reviews_synthetic.csv --out reports/demo --min-cell-n 5
      - name: Tests
        run: pytest -q
